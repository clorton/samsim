syntax = "proto3";
package telemetry.v1;
option go_package = "gpsdemo/gen/telemetry/v1;telemetryv1";

message GPSFix {
  int64 timestamp_ms = 1;
  double latitude = 2;
  double longitude = 3;
  float speed_mps = 4;
  float heading_degrees = 5;
}

message TelemetryPacket {
  string simulator_id = 1;
  string vehicle_id = 2;
  string packet_id = 3;
  repeated GPSFix fixes = 4;
}
